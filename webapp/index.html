<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ede5fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1624" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <title>Кабинет — Перемена</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script src="maxboot.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-list" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8.5 12.5l2.5 2.5 4.5-5"/></symbol>

      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></symbol>

  <header class="topbar">
    <div class="brand">ПЕРЕМЕНА</div>
    <div class="topbar-sub" id="who"></div>
  </header>

  <main id="view" class="view">
    <div class="skeleton" aria-busy="true" aria-label="Загружаю"><i></i><i></i><i></i></div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Разделы" hidden></nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="modal" class="modal" aria-labelledby="modal-title">
    <form method="dialog" class="modal-body" id="modal-body"></form>
  </dialog>

  <script src="app.js"></script>

</html>
