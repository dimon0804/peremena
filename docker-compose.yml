# Полный стек: бот + PostgreSQL + Redis + внутренний балансировщик.
#   docker compose up -d --build
# С HTTPS-прокси (нужен для вебхука и мини-приложения — домен должен смотреть на сервер):
#   docker compose --profile https up -d --build
# Несколько экземпляров бота (планировщик работает только у одного — лидера, остальные принимают HTTP):
#   docker compose up -d --scale bot=3
# Раздельные web и worker — docker-compose.scale.yml (см. README, «Масштабирование»).
services:
  bot:
    build: .
    image: peremena:${PEREMENA_TAG:-local}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://peremena:${POSTGRES_PASSWORD:-peremena}@db:5432/peremena
      REDIS_URL: redis://redis:6379/0
    # Порт на хост публикует lb: у bot своего порта нет, поэтому его можно масштабировать (--scale bot=N)
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Балансировщик перед экземплярами бота: раз в 5 с перечитывает адреса bot из DNS Docker и раздаёт
  # запросы по кругу. Снаружи всё как раньше: 127.0.0.1:${BOT_PORT} — туда ходит хостовый nginx или Caddy.
  lb:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${BOT_PORT:-8080}:8080"
    volumes:
      - ./deploy/Caddyfile.lb:/etc/caddy/Caddyfile:ro
    depends_on:
      - bot

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: peremena
      POSTGRES_USER: peremena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peremena}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peremena -d peremena"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - bot

volumes:
  pgdata:
  redisdata:
  caddydata:
