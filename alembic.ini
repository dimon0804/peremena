# Миграции базы «Перемены». Сервис применяет их сам при старте.
# Новая миграция после изменения app/models.py:
#   alembic revision --autogenerate -m "что изменилось"
# Адрес базы берётся из DATABASE_URL (как у сервиса).
[alembic]
script_location = app/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
