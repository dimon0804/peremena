# Прод-схема для масштаба «все школы региона»: приём и обработка разделены.
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --scale bot=3 --scale worker=4
#
# bot    (ROLE=web)    — вебхук MAX, API мини-приложения, сайт. Событие кладётся в очередь Redis и сразу 200.
#                         За балансировщиком lb, масштабируется по числу запросов.
# worker (ROLE=worker) — обрабатывает очередь событий (все воркеры параллельно), планировщик —
#                         только у одного из них (лидер по замку в Redis). Масштабируется по длине очереди.
#
# Соединений с PostgreSQL: (bot × WEB_CONCURRENCY + worker) × (DB_POOL_SIZE + DB_MAX_OVERFLOW).
# По умолчанию здесь: (2 × 2 + 2) × (5 + 10) = 90 при max_connections=200.
services:
  bot:
    environment:
      ROLE: web
      EVENT_QUEUE: redis
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
    deploy:
      replicas: ${WEB_REPLICAS:-2}

  worker:
    image: peremena:${PEREMENA_TAG:-local}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://peremena:${POSTGRES_PASSWORD:-peremena}@db:5432/peremena
      REDIS_URL: redis://redis:6379/0
      ROLE: worker
      EVENT_QUEUE: redis
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      HANDLER_CONCURRENCY: ${HANDLER_CONCURRENCY:-32}
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]

  redis:
    # очередь событий и замки — в памяти; снимок раз в минуту, чтобы очередь пережила перезапуск Redis
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
