# Тесты, сборка Docker-образа и публикация:
#   - каждый push в main → ghcr.io/dimon0804/peremena:latest и :sha-<коммит>
#   - тег v* → ещё и :<версия>, а архив образа прикладывается к релизу GitHub
#   - если в секретах репозитория есть DOCKERHUB_TOKEN — те же теги уходят в docker.io/dimon0804/peremena
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# по умолчанию только чтение; запись выдаётся одной джобе, которая публикует образ и релиз
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/dimon0804/peremena

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Тесты на SQLite
        run: python -m pytest -q
      - name: Тесты на PostgreSQL и Redis (лидер, общий лимитер MAX, очередь событий)
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
          TEST_REDIS_URL: redis://127.0.0.1:6379/0

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: dimon0804
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ env.HAS_DOCKERHUB == 'true' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Проверка образа
        run: |
          docker run -d --name smoke -p 8080:8080 -e MAX_BOT_TOKEN=smoke ${{ env.IMAGE }}:sha-${GITHUB_SHA::7}
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && exit 0; sleep 2; done
          docker logs smoke; exit 1
      - name: Архив образа для релиза
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag ${{ env.IMAGE }}:sha-${GITHUB_SHA::7} peremena:${GITHUB_REF_NAME#v}
          docker save peremena:${GITHUB_REF_NAME#v} | gzip -9 > peremena-image-${GITHUB_REF_NAME}.tar.gz
          sha256sum peremena-image-${GITHUB_REF_NAME}.tar.gz > peremena-image-${GITHUB_REF_NAME}.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            peremena-image-*.tar.gz
            peremena-image-*.tar.gz.sha256
